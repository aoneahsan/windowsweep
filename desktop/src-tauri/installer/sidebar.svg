<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 164 314" width="164" height="314" role="img" aria-label="windowsweep">
  <title>windowsweep</title>
  <!--
    THE MASTER for sidebar.bmp, the picture on the installer's Welcome and Finish pages
    (bundle.windows.nsis.sidebarImage in tauri.conf.json; NSIS asks for 164 x 314). Without
    it those pages showed NSIS's own stock picture.

    The lockup is brand-kit/logo-stacked.svg, path for path: the header's two strokes above
    the outlined Archivo name. Only the colours move to the dark ground, as the app icon
    draws them: the strokes in the accent #A1DA44 on the page colour #0E100B, the name in the
    dark-appearance ink #F1F3EE, and the accent band along the top that the social cards
    carry. The strapline is left out: at this width it would be 5 px tall.

    Export, from this folder (24-bit, no alpha, as NSIS reads it best):
      npx -y sharp-cli@6.1.0 -i sidebar.svg -o sidebar.png
      python -c "from PIL import Image; Image.open('sidebar.png').convert('RGB').save('sidebar.bmp')"
    then delete sidebar.png.
  -->
  <rect width="164" height="314" fill="#0E100B"/>
  <rect width="164" height="4" fill="#A1DA44"/>
