<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 240" width="900" height="240" role="img" aria-label="windowsweep">
  <title>windowsweep</title>
  <defs>
    <linearGradient id="wswBg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#38bdf8" />
      <stop offset="1" stop-color="#1e3a8a" />
    </linearGradient>
    <linearGradient id="wswClean" x1="0" y1="1" x2="1" y2="0">
      <stop offset="0" stop-color="#ffffff" stop-opacity="0.55" />
      <stop offset="1" stop-color="#ffffff" stop-opacity="0.98" />
    </linearGradient>
    <linearGradient id="wswText" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#0ea5e9" />
      <stop offset="1" stop-color="#1e3a8a" />
    </linearGradient>
    <clipPath id="wswPane">
      <rect x="22" y="30" width="84" height="68" rx="10" />
    </clipPath>
  </defs>

  <!-- Mark, 1.5x -->
  <g transform="translate(24 24) scale(1.5)">
    <rect width="128" height="128" rx="28" fill="url(#wswBg)" />
    <rect x="22" y="30" width="84" height="68" rx="10" fill="#ffffff" opacity="0.14" />
    <g clip-path="url(#wswPane)">
      <path d="M6 112 L54 20 L98 20 L50 112 Z" fill="url(#wswClean)" />
    </g>
    <rect x="22" y="30" width="84" height="68" rx="10" fill="none" stroke="#ffffff" stroke-width="4" opacity="0.92" />
    <g transform="rotate(-62 84 42)">
      <rect x="66" y="38" width="36" height="8" rx="4" fill="#ffffff" />
      <rect x="80" y="46" width="8" height="18" rx="3" fill="#dbeafe" />
    </g>
    <g fill="#ffffff">
      <circle cx="104" cy="26" r="4.5" opacity="0.9" />
      <circle cx="114" cy="16" r="3" opacity="0.7" />
      <circle cx="99" cy="12" r="2.2" opacity="0.5" />
    </g>
  </g>

  <!-- Wordmark: "window" in ink, "sweep" in the gradient; the shared s is the seam -->
  <text x="248" y="150" font-family="'Segoe UI', system-ui, -apple-system, Helvetica, Arial, sans-serif" font-size="120" font-weight="800" letter-spacing="-3" fill="#1f2440">window<tspan fill="url(#wswText)">sweep</tspan></text>
  <text x="252" y="196" font-family="'Segoe UI', system-ui, -apple-system, Helvetica, Arial, sans-serif" font-size="26" font-weight="500" letter-spacing="1" fill="#5b6478">safe, developer-aware Windows cleanup</text>
</svg>
