[package]
name = "windowsweep-desktop"
version = "1.1.0"
description = "windowsweep - reclaim disk space on Windows"
authors = ["Ahsan Mahmood <aoneahsan@gmail.com>"]
edition = "2021"
rust-version = "1.77"
license = "MIT"
repository = "https://github.com/aoneahsan/windowsweep"
default-run = "windowsweep-desktop"

[lib]
name = "windowsweep_desktop_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = ["protocol-asset"] }
tauri-plugin-dialog = "2"
tauri-plugin-opener = "2"
tauri-plugin-os = "2"
tauri-plugin-process = "2"
tauri-plugin-updater = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tiny_http = "0.12"
url = "2"

[profile.release]
codegen-units = 1
lto = true
opt-level = "s"
panic = "abort"
strip = true
