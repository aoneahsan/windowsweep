name: Bug report
description: Something did not work as expected.
title: "[bug] "
labels: ["bug"]
body:
  - type: markdown
    attributes:
      value: |
        Thanks for the report. `windowsweep --report-issue` pre-fills most of this for you.
        **Security issues** go to aoneahsan@gmail.com instead - see SECURITY.md.
  - type: input
    id: version
    attributes:
      label: windowsweep version
      description: Output of `windowsweep --version`.
      placeholder: "windowsweep v1.0.0"
    validations:
      required: true
  - type: input
    id: windows
    attributes:
      label: Windows version and PowerShell version
      description: Settings > System > About, and `$PSVersionTable.PSVersion`.
      placeholder: "Windows 11 23H2 - PowerShell 5.1.22621"
    validations:
      required: true
  - type: dropdown
    id: install
    attributes:
      label: How did you run it?
      options:
        - npx windowsweep
        - npm install -g windowsweep
        - windowsweep.cmd from a clone
        - powershell -File windowsweep.ps1
    validations:
      required: true
  - type: textarea
    id: command
    attributes:
      label: Exact command
      render: powershell
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: What did you expect?
    validations:
      required: true
  - type: textarea
    id: actual
    attributes:
      label: What happened?
      description: Include the output. Redact personal paths if you prefer.
    validations:
      required: true
  - type: textarea
    id: log
    attributes:
      label: Log excerpt
      description: From `~\.windowsweep\logs\`, or attach the zip from `windowsweep --debug-bundle` (review it first).
      render: text
  - type: checkboxes
    id: confirm
    attributes:
      label: Confirm
      options:
        - label: I searched existing issues for duplicates.
          required: true
        - label: I re-ran with `--dry-run` to confirm this is not a misunderstanding of what the section deletes.
          required: true
