name: desktop-ci

# The desktop app's own gates. Separate from `ci.yml` because that job is the
# engine's contract and must stay fast and independent - a Rust toolchain failure
# should never be able to make the CLI look broken.
#
# 🔴 windows-latest only. The app links against WebView2 and spawns
# `powershell.exe`; a green build on any other runner would prove nothing about
# the only platform it ships to.

on:
  push:
    branches: [main]
    paths:
      - 'desktop/**'
      - '.github/workflows/desktop-ci.yml'
  pull_request:
    paths:
      - 'desktop/**'
      - '.github/workflows/desktop-ci.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: desktop-ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  desktop:
    name: desktop
    runs-on: windows-latest

    # The web layer's build-time configuration, at JOB level because two steps
    # build it: `yarn build` below, and `yarn tauri build --no-bundle` at the end,
    # which re-runs it through `beforeBuildCommand`. Setting it on one step only
    # would compile a binary whose keys are blank while the standalone build's
    # were not.
    #
    # These are repository VARIABLES, not secrets, and that is correct rather than
    # a shortcut: every one is a public client identifier that ships inside the
    # bundle by design - a GA4 measurement id, an Amplitude key, a Clarity project
    # id, a Sentry DSN. A value a user can read out of the installer is not a
    # secret, and storing it as one would only hide it from the people reading this
    # file. 🔴 No SERVER secret is ever added here; the updater's signing key stays
    # in `secrets` in the release workflow, which is the real one.
    #
    # 🔴 A FRESH CLONE WITH NONE OF THESE CONFIGURED IS A SUPPORTED CASE, and this
    # job must stay green there. An undefined `vars.X` interpolates to the empty
    # string, and `desktop/src/lib/config.ts` reads every one through a truthiness
    # check, so empty behaves exactly like absent: the feature stays off and the
    # build succeeds. That is the same state this job was in before these lines
    # existed, which is what makes the claim checkable rather than hopeful.
    env:
      VITE_GA4_MEASUREMENT_ID: ${{ vars.VITE_GA4_MEASUREMENT_ID }}
      VITE_AMPLITUDE_API_KEY: ${{ vars.VITE_AMPLITUDE_API_KEY }}
      VITE_CLARITY_PROJECT_ID: ${{ vars.VITE_CLARITY_PROJECT_ID }}
      VITE_SENTRY_DSN: ${{ vars.VITE_SENTRY_DSN }}

    defaults:
      run:
        working-directory: desktop
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: '24'

      - name: Enable corepack and yarn 4
        run: corepack enable

      # HUSKY=0: desktop/package.json installs the pre-commit hook from its postinstall (D37); a CI runner
      # commits nothing, so the hook would only write git config it never uses.
      - name: Install
        env:
          HUSKY: '0'
        run: yarn install --immutable

      # 🔴 Supabase is behind a switch. `SUPABASE_ENABLED` is `true` since 2026-09-25 (TASK-013
      # verified live, O6'), so this step exports the two names for the build below; with the
      # variable absent or anything but `'true'` it is skipped and they never enter the
      # environment at all.
      #
      # The guard is on THIS step and not on the build, deliberately. Putting
      # `if:` on a build step does not build it without Supabase; it does not build
      # it at all. So the switch controls a step that only exports two values, and
      # the build below runs unconditionally either way.
      #
      # `$GITHUB_ENV` is what carries them, because a step's own `env:` block is
      # visible only to that step. The values are read through this step's `env:`
      # rather than interpolated into the shell body - a repository variable is
      # owner-set and not hostile, but a `${{ }}` expansion inside `run:` is a
      # script-injection shape and there is no reason to write one.
      - name: Supabase build variables (only once the shared project is wired)
        if: vars.SUPABASE_ENABLED == 'true'
        shell: bash
        env:
          SUPABASE_URL: ${{ vars.VITE_SUPABASE_URL }}
          SUPABASE_PUBLISHABLE_KEY: ${{ vars.VITE_SUPABASE_PUBLISHABLE_KEY }}
        run: |
          echo "VITE_SUPABASE_URL=$SUPABASE_URL" >> "$GITHUB_ENV"
          echo "VITE_SUPABASE_PUBLISHABLE_KEY=$SUPABASE_PUBLISHABLE_KEY" >> "$GITHUB_ENV"
          echo "Supabase build variables exported for the rest of this job"

      - name: Typecheck
        run: yarn typecheck

      - name: Lint
        run: yarn lint

      # `yarn build` runs the build-time generators and gates as Vite plugins, never a scripts
      # folder (TASK-019, `desktop/vite/`): public/prepaint.js written from src/lib/axes.json;
      # tauri.conf.json checked against the installed CLI's schema - still before anything
      # compiles in Rust, where a config mistake used to surface ten minutes at a time (three
      # cycles on 2026-09-05); the engine mirrored into the bundle and checked; every literal
      # catalogue key resolved. Any of them failing stops the build.
      - name: Build the web layer
        run: yarn build

      # The build rewrites public/prepaint.js before anything reads it, so the shipped file
      # cannot drift from the axis registry. The COMMITTED copy can: an axes.json change
      # committed without the file it generates. This checkout was clean, so any difference
      # the build left is exactly that - and the window would otherwise have run a different
      # set of axes before first paint than the committed file shows a reviewer.
      - name: The committed pre-paint script matches what the build wrote
        shell: bash
        run: git diff --exit-code -- public/prepaint.js

      # vitest, the pre-approved classes only (D37): the settings newest-wins rule and
      # calendar days across a clock change. Built first, so a test never judges stale output.
      - name: Unit tests
        run: yarn test

      # No source map may reach a release build.
      - name: No source maps in the output
        shell: bash
        run: |
          hits="$(find dist -name '*.map' -o -name '*.js' -exec grep -l 'sourceMappingURL' {} + 2>/dev/null || true)"
          if [ -n "$hits" ]; then echo "source maps found:"; echo "$hits"; exit 1; fi
          echo "no source maps in dist/"

      # The build's engine plugin checks its own copy; this asserts on the ARTEFACT, from
      # outside the generator. tauri-build resolves `bundle.resources` and fails LATE,
      # several steps later, with a message about a glob rather than about a missing tree -
      # so this asserts the tree has real FILES in it while the cause is still obvious.
      - name: The bundled engine has files in it
        shell: bash
        run: |
          n="$(find src-tauri/resources/windowsweep -type f | wc -l)"
          echo "bundled files: $n"
          test "$n" -ge 20 || { echo "the engine did not reach the bundle"; exit 1; }
          test -f src-tauri/resources/windowsweep/windowsweep.ps1

      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy

      - uses: swatinem/rust-cache@v2
        with:
          workspaces: desktop/src-tauri

      - name: Rust formatting
        working-directory: desktop/src-tauri
        run: cargo fmt --all -- --check

      - name: Rust lints
        working-directory: desktop/src-tauri
        run: cargo clippy --all-targets -- -D warnings

      - name: Rust tests
        working-directory: desktop/src-tauri
        run: cargo test

      # Compiles the whole app without producing installers - the installers are
      # the release workflow's job and take several minutes longer.
      - name: Build the desktop binary
        run: yarn tauri build --no-bundle
