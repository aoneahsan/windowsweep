[package]
name = "windowsweep-desktop"
version = "1.1.0"
description = "windowsweep - reclaim disk space on Windows"
authors = ["Ahsan Mahmood <aoneahsan@gmail.com>"]
edition = "2021"
rust-version = "1.77"
license = "MIT"
repository = "https://github.com/aoneahsan/windowsweep"
default-run = "windowsweep-desktop"

[lib]
name = "windowsweep_desktop_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
# 🔴 No `protocol-asset`. Nothing in this app loads a local file through
# `asset://` - the report screen reads its JSON through the `read_run_report`
# command, which is confined to the run folder. The feature was enabled
# briefly and CI caught it: tauri-build refuses a Cargo feature with no
# matching entry in tauri.conf.json, which is the allowlist check doing
# exactly its job. Least privilege means removing the feature, not adding
# the config entry.
tauri = { version = "2", features = [] }
tauri-plugin-dialog = "2"
tauri-plugin-opener = "2"
tauri-plugin-os = "2"
tauri-plugin-process = "2"
tauri-plugin-updater = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tiny_http = "0.12"
url = "2"

# Drive enumeration for the disk picker. Scoped to the one target it means
# anything on: this app spawns `powershell.exe` and links WebView2, so it is
# Windows-only already, and a `cfg(not(windows))` arm here would be dead code no
# gate ever runs.
#
# 🔴 `windows-sys` 0.61.2 was ALREADY resolved in Cargo.lock before this entry
# existed - pulled in transitively by tauri and its dependencies - so naming it
# directly adds no crate and no new version to the lock. It only makes the
# dependency honest: relying on another crate's feature selection to keep
# `Win32_Storage_FileSystem` switched on is the kind of thing that compiles today
# and stops compiling when an unrelated dependency trims its own features.
#
# This is unrelated to the `tauri` feature allowlist noted above - tauri-build
# checks `tauri`'s features against tauri.conf.json, not another crate's.
[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.61", features = ["Win32_Storage_FileSystem"] }

[profile.release]
codegen-units = 1
lto = true
opt-level = "s"
panic = "abort"
strip = true
