<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>windowsweep - Display</title>
<meta name="description" content="windowsweep desktop, click dummy - component library 5 of 8: Cards, stats, lists, badges, tiers, avatars, progress, skeletons, empty states and banners.">
<link rel="stylesheet" href="tokens.css">
<link rel="stylesheet" href="shared.css">
<link rel="stylesheet" href="components.css">
<link rel="stylesheet" href="gallery.css">
<script src="app.js"></script>
</head>
<body>

<div class="app">
  <header class="titlebar" data-ws-titlebar></header>

  <div class="shell">
    <nav class="rail" data-ws-rail aria-label="Main"></nav>

    <main class="content">

      <section class="band band-app band-tight">
        <div class="wrap">
          <p class="caps ink-3">Component library &middot; 5 of 8</p>
          <h1 class="t-xl wide">Display</h1>
          <p class="lede">The read-only vocabulary. Every skeleton is shaped like the thing it stands in for, never a generic block.</p>
          <div data-g-nav style="margin-top:var(--sp-5)"></div>
        </div>
      </section>

      <section class="band band-well band-tight">
        <div class="wrap" data-g-racnote></div>
      </section>

      <section class="band band-app band-tight">
        <div class="wrap" data-ws-playground="stat"></div>
      </section>

      <section class="band band-app">
        <div class="wrap" data-g-mount style="display:flex;flex-direction:column;gap:var(--sp-10)"></div>
      </section>

      <div style="height:var(--sp-16)"></div>
    </main>
  </div>

  <footer class="statusbar">
    <span class="dot" aria-hidden="true"></span>
    <span>component library</span>
    <span class="only-wide">Display &middot; 5 of 8</span>
    <span style="margin-inline-start:auto" data-ws-text="storageMode">storage: -</span>
  </footer>
</div>

<script src="vendor/d3-color.js"></script>
<script src="vendor/d3-interpolate.js"></script>
<script src="vendor/d3-array.js"></script>
<script src="vendor/d3-path.js"></script>
<script src="vendor/d3-format.js"></script>
<script src="vendor/d3-time.js"></script>
<script src="vendor/d3-time-format.js"></script>
<script src="vendor/d3-scale.js"></script>
<script src="vendor/d3-shape.js"></script>
<script src="vendor/d3-hierarchy.js"></script>
<script src="seed.js"></script>
<script src="db.js"></script>
<script src="reclaim-map.js"></script>
<script src="widgets.js"></script>
<script src="gallery.js"></script>
<script src="playground.js"></script>
<script src="g-display.js"></script>
<script src="wire.js"></script>
<script src="demo.js"></script>
</body>
</html>
