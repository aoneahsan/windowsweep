<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512" role="img" aria-label="windowsweep">
  <title>windowsweep</title>
  <!--
    THE ICON MASTER. SVG first: every PNG and the .ico are exported from this file
    by `yarn tauri icon src-tauri/icons/icon.svg`, and it is re-exported rather
    than hand-edited.

    The mark is the product's one visual metaphor - the sweep, three strokes of
    decreasing weight wiping a pane clean along a diagonal - taken from the hero
    of the approved click dummy so the installer, the taskbar and the home screen
    all carry the same shape.

    Colours are the registered palette, converted from the OKLCH tokens rather
    than picked by eye:
      background  oklch(0.168 0.010 128)  #0e100b
      accent      oklch(0.820 0.185 128)  #a1da44   (hue 128, the registered one)
  -->
  <defs>
    <clipPath id="round">
      <rect x="0" y="0" width="512" height="512" rx="112" ry="112"/>
    </clipPath>
    <linearGradient id="depth" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#141810"/>
      <stop offset="1" stop-color="#0b0d08"/>
    </linearGradient>
  </defs>

  <g clip-path="url(#round)">
    <rect width="512" height="512" fill="url(#depth)"/>

    <!-- the sweep: same three curves as the home hero, scaled to the tile -->
    <g fill="none" stroke="#a1da44" stroke-linecap="round">
      <path d="M56 348 C 190 348, 202 132, 268 132 S 380 268, 470 168" stroke-width="52"/>
      <path d="M56 414 C 196 414, 210 236, 288 236 S 396 350, 470 258" stroke-width="24" opacity=".5"/>
      <path d="M56 462 C 202 462, 216 330, 306 330 S 410 414, 470 336" stroke-width="11" opacity=".3"/>
    </g>
  </g>
</svg>
