name: ci

on:
  push:
    branches: [main]
  pull_request:

jobs:
  ci:
    name: ci
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Launcher syntax and version
        shell: pwsh
        run: |
          node -c bin/windowsweep.js
          node bin/windowsweep.js --version
          npm run --silent version:check

      - name: Self-test on Windows PowerShell 5.1
        shell: cmd
        run: powershell.exe -NoProfile -NoLogo -ExecutionPolicy Bypass -File windowsweep.ps1 --self-test --no-color --no-report

      - name: Self-test on PowerShell 7
        shell: pwsh
        run: ./windowsweep.ps1 --self-test --no-color --no-report

      - name: Dry-run of the safe batch (both hosts)
        shell: cmd
        run: |
          powershell.exe -NoProfile -NoLogo -ExecutionPolicy Bypass -File windowsweep.ps1 --dry-run --all --yes --no-color --no-report
          pwsh -NoProfile -File windowsweep.ps1 --dry-run --all --yes --no-color --no-report

      - name: Section catalogue and targets
        shell: pwsh
        run: |
          node bin/windowsweep.js --list
          node bin/windowsweep.js --list-targets --no-color --no-report

      - name: PSScriptAnalyzer
        shell: pwsh
        run: |
          Install-Module PSScriptAnalyzer -Force -Scope CurrentUser
          Invoke-ScriptAnalyzer -Path . -Recurse -Settings PSScriptAnalyzerSettings.psd1 -EnableExit

      - name: Every docs page ends on its own footer
        shell: pwsh
        run: |
          # A page that gains a section by appending ends BELOW its Last Updated line, and
          # nothing else notices: the markdown is valid, the build is green, and the mirror is
          # byte-identical to a source that is itself wrong. It happened twice on 2026-09-08,
          # to safety-model.md and reports-and-logs.md, and both times a person reading to the
          # bottom was the only instrument that caught it. PENDING-TASKS DONE-008.
          $skip = @('MANUAL-TASKS.md','DONE-TASKS.md','PACKAGES.md','PROJECT-CONTEXT.md','README.md')
          $bad = @()
          foreach ($f in Get-ChildItem docs/*.md) {
            if ($skip -contains $f.Name) { continue }
            $lines = @(Get-Content $f.FullName | Where-Object { $_.Trim() -ne '' })
            if ($lines.Count -eq 0) { continue }
            if ($lines[-1] -notmatch '^Last Updated: \d{4}-\d{2}-\d{2}') {
              $bad += "$($f.Name) ends on: $($lines[-1])"
            }
          }
          if ($bad.Count -gt 0) { $bad | ForEach-Object { Write-Host $_ }; throw "$($bad.Count) docs page(s) do not end on their footer" }
          Write-Host 'every docs page ends on its Last Updated footer'

      - name: Tarball contents are the allowlist only
        shell: pwsh
        run: |
          $listing = npm pack --dry-run 2>&1 | Out-String
          Write-Host $listing
          foreach ($forbidden in 'CLAUDE.md', 'AGENTS.md', 'docs/', 'temp/', 'desktop/', '.npmrc', '.env', 'remaining-work.md', 'remaining-work-summary.md', 'what-this-project-consists-of.md', 'PENDING-TASKS.md', 'portfolio-info') {
            if ($listing -match [regex]::Escape($forbidden)) { throw "tarball would ship $forbidden" }
          }
          if ((Test-Path 'AI-INTEGRATION-GUIDE.md') -and -not ($listing -match 'AI-INTEGRATION-GUIDE\.md')) { throw 'AI-INTEGRATION-GUIDE.md exists but is not in the tarball' }
