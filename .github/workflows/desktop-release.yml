name: desktop-release

# Builds the NSIS and MSI installers and publishes them to a GitHub Release.
#
# Runs on a `desktop-v*` tag push, and by manual dispatch when a tag needs
# rebuilding. The updater signing secrets - `TAURI_SIGNING_PRIVATE_KEY` and
# `TAURI_SIGNING_PRIVATE_KEY_PASSWORD` - are set on the repository, so a tag
# push produces signed artefacts. The release is created as a DRAFT: a person
# reads the asset list before anything is published.
#
# 🔴 Why the last step asserts the asset list. Without
# `bundle.createUpdaterArtifacts` in tauri.conf.json, or without the signing
# key in the build environment, the bundler produces installers with no `.sig`
# beside them. Nothing earlier fails: the build is green, the release looks
# complete, and the updater has nothing to verify - so every install is
# stranded on the version it already has, and the only symptom is an update
# that never arrives. The Elevation screen and the desktop README both promise
# a SHA-256 checksum for each installer and a minisign signature the app's own
# updater checks, so the release either carries all six artefacts or this
# workflow fails.

on:
  push:
    tags:
      - 'desktop-v*'
  workflow_dispatch:
    inputs:
      tag:
        description: 'The desktop tag to build, e.g. desktop-v1.1.0'
        required: true
        type: string

permissions:
  contents: write

jobs:
  release:
    name: installers
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v5
        with:
          ref: ${{ inputs.tag || github.ref_name }}

      - uses: actions/setup-node@v5
        with:
          node-version: '24'

      - run: corepack enable

      - name: Install
        working-directory: desktop
        run: yarn install --immutable

      - name: Bundle the engine
        working-directory: desktop
        run: yarn sync:cli

      # 🔴 The app version and the bundled engine version must agree. They are the
      # same product to a person reading an About box, and a mismatch means the
      # window reports one number while the engine writing the reports reports
      # another.
      - name: The app version matches the bundled engine
        shell: bash
        run: |
          app="$(node -p "require('./desktop/package.json').version")"
          engine="$(cat VERSION | tr -d '[:space:]')"
          tauri="$(node -p "require('./desktop/src-tauri/tauri.conf.json').version")"
          echo "app=$app engine=$engine tauri=$tauri"
          if [ "$app" != "$engine" ] || [ "$tauri" != "$engine" ]; then
            echo "version mismatch - the desktop app, its Tauri config and the bundled engine must agree"
            exit 1
          fi

      # 🔴 The same sentence promises "a minisign signature the app's own updater
      # checks". A placeholder pubkey leaves that half of the promise with nothing
      # behind it, and a placeholder is also the shape a bad merge or a reverted
      # config takes. Refuse here rather than publish a release whose shipped copy
      # describes an artefact it does not contain.
      - name: The updater public key is real
        shell: bash
        run: |
          key="$(node -p "require('./desktop/src-tauri/tauri.conf.json').plugins.updater.pubkey")"
          if [ "$key" = "REPLACE_WITH_UPDATER_PUBLIC_KEY" ] || [ -z "$key" ]; then
            echo "the updater public key is still a placeholder."
            echo "The Elevation screen and the desktop README both promise a minisign"
            echo "signature the updater checks. Generate the keypair, put the public half"
            echo "in tauri.conf.json and the private half in TAURI_SIGNING_PRIVATE_KEY,"
            echo "or remove that clause from the copy first."
            exit 1
          fi
          echo "updater public key present"

      - uses: dtolnay/rust-toolchain@stable
      - uses: swatinem/rust-cache@v2
        with:
          workspaces: desktop/src-tauri

      - uses: tauri-apps/tauri-action@v0
        id: tauri
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        with:
          projectPath: desktop
          tagName: ${{ inputs.tag || github.ref_name }}
          releaseName: 'windowsweep desktop ${{ inputs.tag || github.ref_name }}'
          releaseDraft: true
          prerelease: false
          includeUpdaterJson: true

      # 🔴 THE APPROVED COPY PROMISES THIS FILE. The Elevation screen and the
      # desktop README both say "every release publishes a SHA-256 checksum for
      # each installer" - approved by the owner on 2026-09-05 - and until this
      # step existed the workflow produced no checksum at all. A promise in
      # shipped copy with no step behind it is the defect; the fix is the step,
      # not a softer sentence.
      - name: Publish a SHA-256 checksum for every installer
        shell: pwsh
        run: |
          $dir = 'desktop/src-tauri/target/release/bundle'
          $files = Get-ChildItem -Path $dir -Recurse -Include *.exe, *.msi -File
          if ($files.Count -eq 0) { throw 'no installer was produced - nothing to checksum' }
          $out = 'SHA256SUMS.txt'
          Remove-Item $out -ErrorAction SilentlyContinue
          foreach ($f in $files) {
            $h = (Get-FileHash -Algorithm SHA256 -Path $f.FullName).Hash.ToLower()
            "$h  $($f.Name)" | Add-Content -Encoding utf8 $out
            Write-Host "$h  $($f.Name)"
          }
          Write-Host "checksums for $($files.Count) installer(s) -> $out"

      # 🔴 THIS STEP RACES THE RELEASE INTO EXISTENCE, and it lost on 2026-09-07.
      # tauri-action had just created the draft, and `gh release upload` one step
      # later failed with a bare `release not found` - then the identical command
      # from a workstation eight minutes on succeeded against the same draft. So it
      # is eventual consistency, NOT drafts being unreachable, which is the wrong
      # diagnosis to reach for and would have sent the fix in the wrong direction.
      #
      # The cost of losing is specific: the five artefacts tauri-action attaches all
      # arrive, the release LOOKS complete, and the one file the shipped copy
      # promises by name is the one missing - so the failure lands exactly where a
      # reader would check the promise.
      - name: Attach the checksum file to the release
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ inputs.tag || github.ref_name }}
        run: |
          for attempt in 1 2 3 4 5 6; do
            if gh release upload "$TAG" SHA256SUMS.txt --clobber; then
              echo "attached on attempt $attempt"
              exit 0
            fi
            echo "release not visible yet (attempt $attempt of 6); waiting 10s"
            sleep 10
          done
          echo "::error::could not attach SHA256SUMS.txt to $TAG after 6 attempts over ~60s."
          echo "The release exists but is missing the checksum file the shipped copy promises by name."
          exit 1

      # 🔴 THE ASSET LIST IS THE ONLY EVIDENCE THAT THE PROMISE HELD. Every step
      # above can pass while the release is missing the half a user cannot see:
      # the two `.sig` files exist only if `bundle.createUpdaterArtifacts` is
      # true AND the signing key reached the bundler, and `latest.json` only if
      # `includeUpdaterJson` produced one. A release missing any of them is
      # worse than a failed one, because it looks finished - so read what is
      # actually attached and refuse to leave behind a draft that cannot be
      # updated from. Both installers are updater-enabled targets on Windows, so
      # both are expected to carry a signature.
      - name: The release carries every artefact the shipped copy promises
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ inputs.tag || github.ref_name }}
        run: |
          assets="$(gh release view "$TAG" --json assets --jq '.assets[].name')"
          echo "assets attached to $TAG:"
          echo "$assets"
          have() {
            while IFS= read -r name; do
              [ -n "$name" ] || continue
              case "$name" in ($1) return 0 ;; esac
            done <<< "$assets"
            return 1
          }
          missing=''
          for spec in \
            '*-setup.exe|the NSIS installer' \
            '*-setup.exe.sig|the NSIS installer minisign signature' \
            '*.msi|the MSI installer' \
            '*.msi.sig|the MSI installer minisign signature' \
            'latest.json|the updater manifest' \
            'SHA256SUMS.txt|the SHA-256 checksums'; do
            if ! have "${spec%%|*}"; then
              missing="${missing}  ${spec%%|*}  (${spec##*|})"$'\n'
            fi
          done
          if [ -n "$missing" ]; then
            echo "this release does not carry what the shipped copy promises. Missing:"
            printf '%s' "$missing"
            echo "A missing .sig means the bundler ran without TAURI_SIGNING_PRIVATE_KEY or"
            echo "without bundle.createUpdaterArtifacts, so the updater has nothing to verify"
            echo "and every install stays stranded on the version it already has."
            echo "A missing latest.json means includeUpdaterJson produced no manifest, so the"
            echo "endpoint in tauri.conf.json would 404."
            echo "Do not publish this draft. Fix the cause and re-run the tag."
            exit 1
          fi
          echo "all six promised artefacts are attached: both installers, both signatures, latest.json, SHA256SUMS.txt"
